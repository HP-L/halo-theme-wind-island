# 风屿 (Wind Island) - Hexo Theme Configuration
# Menu
menu:
  归档: /archives
  分类: /categories
  标签: /tags
  关于: /about

# Style
style:
  color_scheme: nightIsland
  custom_font: "LXGW Marker Gothic"

# Home page
home:
  hero_image: ""
  cover_strip_source: pinned
  cover_strip_category: ""
  cover_strip_tag: ""
  featured_category: ""
  topic_categories: []
  contact_page: ""

# Panel background images (customizable per season & island color)
# Supports:
#   - Simple path: "/images/custom-bg.png"  (automatically wrapped in url())
#   - Full CSS value: "linear-gradient(#00000075,#141c287d),url(/images/bg.png)"
#   - Just a URL: "url(/images/custom-bg.png)"
# Leave empty to use default seasonal images
panel_backgrounds:
  # 夜屿 (nightIsland) — dark mode
  spring_night: "/halo-theme-wind-island/images/24/谷雨-夜.png"
  summer_night: "/halo-theme-wind-island/images/24/芒种-夜.png"
  autumn_night: "/halo-theme-wind-island/images/24/霜降-夜.png"
  winter_night: "/halo-theme-wind-island/images/24/大寒-夜.png"
  # 暮屿 (duskIsland) — dusk mode
  spring_dusk: "/halo-theme-wind-island/images/24/谷雨-夜.png"
  summer_dusk: "/halo-theme-wind-island/images/24/芒种-夜.png"
  autumn_dusk: "/halo-theme-wind-island/images/24/霜降-夜.png"
  winter_dusk: "/halo-theme-wind-island/images/24/大寒-夜.png"
  # 晓屿 (dawnIsland) — light mode
  spring_dawn: "/halo-theme-wind-island/images/24/谷雨.png"
  summer_dawn: "/halo-theme-wind-island/images/24/芒种.png"
  autumn_dawn: "/halo-theme-wind-island/images/24/霜降.png"
  winter_dawn: "/halo-theme-wind-island/images/24/大寒.png"

# Post
post:
  enable_reader_settings: true
  reading_time: true

# Footer
footer:
  copyright_start_year: ""
  icp_number: ""
  icp_url: ""
  public_security_number: ""
  public_security_url: ""
  public_security_icon: ""

# Comments
comment:
  enable: false

# CDN / Asset prefix
asset_prefix: ""
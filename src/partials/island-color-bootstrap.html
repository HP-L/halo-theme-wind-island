<script th:inline="javascript">
  (() => {
    const root = document.documentElement;
    const storageKey = "wind-island.island-color.v1";
    const phases = ["nightIsland", "duskIsland", "dawnIsland", "followSystem"];
    const configuredPhase = /*[[${theme.config?.style?.color_scheme ?: 'nightIsland'}]]*/ "nightIsland";
    const fallbackPhase = phases.includes(configuredPhase) ? configuredPhase : "nightIsland";
    let phase = fallbackPhase;

    try {
      const storedPhase = localStorage.getItem(storageKey);
      if (storedPhase && phases.includes(storedPhase)) phase = storedPhase;
    } catch {
      // Storage can be unavailable in private or hardened browsing contexts.
    }

    const systemPrefersLight = window.matchMedia?.("(prefers-color-scheme: light)").matches ?? false;
    const resolvedPhase = phase === "followSystem" ? (systemPrefersLight ? "dawnIsland" : "nightIsland") : phase;
    root.dataset.defaultIslandColor = fallbackPhase;
    root.dataset.islandColor = phase;
    root.dataset.resolvedIslandColor = resolvedPhase;
    root.dataset.colorScheme = resolvedPhase === "dawnIsland" ? "light" : "dark";

    const themeColor = document.querySelector('meta[name="theme-color"]');
    themeColor?.setAttribute(
      "content",
      resolvedPhase === "dawnIsland" ? "#e8eff0" : resolvedPhase === "duskIsland" ? "#171e22" : "#18181b",
    );
  })();
</script>
